<!-- SUSCRIPCIÓN -->
<section class="psub" id="suscribir">
<div class="wrap-wide psub-in">
<div class="psub-txt">
<span class="eyebrow" style="color:var(--boya)">No te pierdas ninguna</span>
<h2>Recibe Puerto<br/>en tu correo</h2>
<p>Una edición cuando hay algo que contar. Sin spam, sin calendario. Te guardamos un lugar en cubierta.</p>
</div>
<form class="psub-form" data-puerto data-ok-class="psub-ok" novalidate>
<input aria-hidden="true" autocomplete="off" name="web" style="position:absolute;left:-9999px;width:1px;height:1px;opacity:0" tabindex="-1"/>
<input aria-label="Correo" name="email" placeholder="tu@correo.cl" required="" type="email"/>
<button class="btn" type="submit">Suscribirme</button>
</form>
</div>
</section>
<div id="foot"></div>
<div class="drawer" hidden="" id="drawer"></div>
<div class="mob"><a class="btn" href="#suscribir">Suscribirme a Puerto</a></div>
